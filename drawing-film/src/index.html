<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>قوة الرسم الخارقة</title>
<style>
@font-face{font-family:Lalezar;src:url(fonts/Lalezar.ttf)}
@font-face{font-family:Tajawal;font-weight:500;src:url(fonts/Tajawal-500.ttf)}
@font-face{font-family:Tajawal;font-weight:800;src:url(fonts/Tajawal-800.ttf)}
html,body{margin:0;padding:0;background:#000;overflow:hidden}
#wrap{position:relative;width:1920px;height:1080px;overflow:hidden}
svg{position:absolute;inset:0;width:1920px;height:1080px}
#tex{position:absolute;inset:0;width:1920px;height:1080px;mix-blend-mode:multiply;pointer-events:none}
text{font-family:Lalezar}
.t2{font-family:Tajawal;font-weight:800}
</style>
</head>
<body>
<div id="wrap">
<svg id="stage" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
<defs>
  <filter id="cut" x="-15%" y="-15%" width="130%" height="140%">
    <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="4" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="6" xChannelSelector="R" yChannelSelector="G" result="d"/>
    <feDropShadow in="d" dx="5" dy="8" stdDeviation="5" flood-color="#2b1d10" flood-opacity="0.38"/>
  </filter>
  <filter id="cutS" x="-15%" y="-15%" width="130%" height="140%">
    <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="2" seed="9" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="4" xChannelSelector="R" yChannelSelector="G" result="d"/>
    <feDropShadow in="d" dx="3" dy="5" stdDeviation="3" flood-color="#2b1d10" flood-opacity="0.35"/>
  </filter>
  <filter id="big" x="-5%" y="-10%" width="110%" height="130%">
    <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="2" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="14" xChannelSelector="R" yChannelSelector="G" result="d"/>
    <feDropShadow in="d" dx="0" dy="-8" stdDeviation="7" flood-color="#2b1d10" flood-opacity="0.32"/>
  </filter>
  <radialGradient id="glow"><stop offset="0" stop-color="#fff6b0" stop-opacity=".95"/><stop offset="1" stop-color="#fff6b0" stop-opacity="0"/></radialGradient>
</defs>
<g id="scenes"></g>
<g id="capG" filter="url(#cutS)"><rect id="capR" x="0" y="-48" width="100" height="96" rx="10" fill="#fffaf0"/><text id="capT" class="t2" x="0" y="16" text-anchor="middle" direction="rtl" font-size="46" fill="#2a2320"></text></g>
<g id="wipe"></g>
</svg>
<img id="tex" src="paper.png">
</div>
<script>
// ---------- helpers ----------
const W=1920,H=1080;
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const k=(t,a,b)=>clamp((t-a)/(b-a));
const eo=t=>1-Math.pow(1-t,3);
const eio=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const back=t=>{if(t<=0)return 0;if(t>=1)return 1;const c1=2.0,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)};
const pop=(t,t0,d=.45)=>back(k(t,t0,t0+d));
const lerp=(a,b,t)=>a+(b-a)*t;
let FRAME=0;
const hash=(a,b)=>{let x=Math.sin(a*127.1+b*311.7)*43758.5453;return x-Math.floor(x)};
function rnd(seed){let s=seed;return()=>{s=(s*16807)%2147483647;return (s-1)/2147483646}}
const idn=new Map();let idc=0;
const $=id=>document.getElementById(id);
function P(id,o={}){
  const el=typeof id==='string'?$(id):id; if(!el) return;
  const key=typeof id==='string'?id:el.id;
  if(!idn.has(key)) idn.set(key,++idc);
  const n=idn.get(key), j=o.j??1;
  const x=o.x??0,y=o.y??0,s=o.s??1,r=o.r??0,op=o.o??1;
  const sx=o.sx??s, sy=o.sy??s;
  const jr=(hash(FRAME,n)-.5)*1.4*j, jx=(hash(FRAME,n+50)-.5)*3.2*j, jy=(hash(FRAME,n+99)-.5)*3.2*j;
  el.setAttribute('transform',`translate(${(x+jx).toFixed(1)} ${(y+jy).toFixed(1)}) rotate(${(r+jr).toFixed(2)}) scale(${sx.toFixed(3)} ${sy.toFixed(3)})`);
  el.setAttribute('opacity',op.toFixed(3));
  el.style.display=(op<=0.002||Math.abs(sx)<0.002||Math.abs(sy)<0.002)?'none':'';
}
function draw(id,p){const el=$(id); if(!el)return; el.style.strokeDasharray='1 1'; el.style.strokeDashoffset=(1-clamp(p)).toFixed(4); el.style.display=p<=0?'none':'';}
function torn(x0,x1,y,amp,seed,step=38,bottom=1200){
  const r=rnd(seed);let d=`M ${x0} ${bottom} L ${x0} ${y}`;
  for(let x=x0;x<=x1+step;x+=step){d+=` L ${x.toFixed(0)} ${(y+(r()-.5)*amp+Math.sin(x/170+seed)*amp*.8).toFixed(1)}`}
  return d+` L ${x1+step} ${bottom} Z`;
}
function sunburst(n,c1,c2,R=1600){
  let s=`<circle r="${R}" fill="${c1}"/>`;
  for(let i=0;i<n;i+=2){const a0=i/n*Math.PI*2,a1=(i+1)/n*Math.PI*2;
    s+=`<path d="M0 0 L${(Math.cos(a0)*R).toFixed(0)} ${(Math.sin(a0)*R).toFixed(0)} L${(Math.cos(a1)*R).toFixed(0)} ${(Math.sin(a1)*R).toFixed(0)}Z" fill="${c2}"/>`}
  return s;
}
function star(r1,r2,n=5){let d='';for(let i=0;i<n*2;i++){const r=i%2?r2:r1,a=i/(n*2)*Math.PI*2-Math.PI/2;d+=(i?'L':'M')+(Math.cos(a)*r).toFixed(1)+' '+(Math.sin(a)*r).toFixed(1)}return d+'Z'}
const txt=(s,size,fill,extra='')=>`<text text-anchor="middle" direction="rtl" font-size="${size}" fill="${fill}" paint-order="stroke" stroke="#fffaf0" stroke-width="${Math.round(size*.16)}" stroke-linejoin="round" ${extra}>${s}</text>`;

// ---------- components ----------
const SKIN='#f3c79b';
function kid(id,shirt='#2a9d8f',hair='#3b2416',pants='#264653'){
  return `<g id="${id}" filter="url(#cut)">
   <rect x="-36" y="-125" width="30" height="125" rx="13" fill="${pants}"/><rect x="6" y="-125" width="30" height="125" rx="13" fill="${pants}"/>
   <ellipse cx="-24" cy="-6" rx="28" ry="13" fill="#3a3a3a"/><ellipse cx="24" cy="-6" rx="28" ry="13" fill="#3a3a3a"/>
   <g id="${id}-aL"><rect x="-80" y="-238" width="28" height="112" rx="14" fill="${shirt}"/><circle cx="-66" cy="-124" r="17" fill="${SKIN}"/>
     <g id="${id}-pen" style="display:none"><rect x="-74" y="-150" width="14" height="70" rx="3" fill="#f9c74f" transform="rotate(25 -66 -124)"/><path d="M-74 -80 L-60 -80 L-67 -62Z" fill="#333" transform="rotate(25 -66 -124)"/></g></g>
   <g id="${id}-aR"><rect x="52" y="-238" width="28" height="112" rx="14" fill="${shirt}"/><circle cx="66" cy="-124" r="17" fill="${SKIN}"/></g>
   <rect x="-62" y="-258" width="124" height="150" rx="44" fill="${shirt}"/>
   <path d="M-30 -258 L0 -222 L30 -258Z" fill="#fffaf0" opacity=".9"/>
   <circle cx="-72" cy="-322" r="15" fill="${SKIN}"/><circle cx="72" cy="-322" r="15" fill="${SKIN}"/>
   <circle cx="0" cy="-325" r="74" fill="${SKIN}"/>
   <path d="M-77 -322 C-84 -420 84 -428 77 -322 C66 -372 20 -362 -2 -386 C-22 -360 -60 -372 -77 -322Z" fill="${hair}"/>
   <g id="${id}-eyes"><ellipse cx="-26" cy="-322" rx="8" ry="11" fill="#1f1a17"/><ellipse cx="26" cy="-322" rx="8" ry="11" fill="#1f1a17"/>
   <circle cx="-23" cy="-326" r="3" fill="#fff"/><circle cx="29" cy="-326" r="3" fill="#fff"/></g>
   <circle cx="-46" cy="-292" r="12" fill="#f28b82" opacity=".65"/><circle cx="46" cy="-292" r="12" fill="#f28b82" opacity=".65"/>
   <path id="${id}-mS" d="M-24 -292 Q0 -262 24 -292" stroke="#7a2e1f" stroke-width="7" fill="none" stroke-linecap="round"/>
   <path id="${id}-mW" d="M-18 -280 Q0 -296 18 -280" stroke="#7a2e1f" stroke-width="7" fill="none" stroke-linecap="round" style="display:none"/>
   <ellipse id="${id}-mO" cx="0" cy="-282" rx="13" ry="16" fill="#7a2e1f" style="display:none"/>
   <path id="${id}-mB" d="M-30 -294 Q0 -250 30 -294Z" fill="#7a2e1f" style="display:none"/>
  </g>`;
}
function mouth(id,m){for(const s of ['S','W','O','B'])$(id+'-m'+s).style.display=(s===m)?'':'none'}
function arm(id,side,a){const g=$(id+'-a'+side);const px=side==='L'?-60:60;g.setAttribute('transform',`rotate(${a} ${px} -232)`)}
function blink(id,t,off=0){const p=((t+off)%3.7);const sc=p<.12?0.15:1;$(id+'-eyes').setAttribute('transform',`translate(0 ${-322*(1-sc)}) scale(1 ${sc})`)}
function pencil(id,face=false,cape=false){
  return `<g id="${id}" filter="url(#cut)">
   ${cape?`<path id="${id}-cape" d="M-30 -190 C-110 -120 -130 0 -150 90 C-90 60 -60 80 -20 40 Z" fill="#e63946"/>`:''}
   <rect x="-34" y="-280" width="68" height="56" rx="16" fill="#f4a6b8"/>
   <rect x="-36" y="-232" width="72" height="40" fill="#bfc5cc"/><rect x="-36" y="-218" width="72" height="7" fill="#9aa1a9"/>
   <rect x="-34" y="-194" width="68" height="250" fill="#f9c74f"/><rect x="-12" y="-194" width="24" height="250" fill="#f3a712"/>
   <path d="M-34 56 L34 56 L0 150Z" fill="#f1d1a8"/><path d="M-11 118 L11 118 L0 150Z" fill="#333"/>
   ${face?`<ellipse cx="-14" cy="-110" rx="7" ry="10" fill="#1f1a17"/><ellipse cx="14" cy="-110" rx="7" ry="10" fill="#1f1a17"/><path d="M-16 -82 Q0 -62 16 -82" stroke="#7a2e1f" stroke-width="6" fill="none" stroke-linecap="round"/><circle cx="-26" cy="-88" r="7" fill="#f28b82" opacity=".7"/><circle cx="26" cy="-88" r="7" fill="#f28b82" opacity=".7"/>`:''}
   ${cape?`<rect x="-36" y="-160" width="72" height="16" fill="#e63946"/><path d="M0 -40 l14 -24 h-28z" fill="#e63946"/>`:''}
  </g>`;
}
function badge(id,label,bg='#264653',fg='#fffaf0',size=64){
  return `<g id="${id}" filter="url(#cutS)"><rect class="bR" x="0" y="${-size*.95}" width="10" height="${size*1.7}" rx="${size*.4}" fill="${bg}"/>
   <text class="bT" text-anchor="middle" direction="rtl" font-size="${size}" fill="${fg}" y="${size*.32}">${label}</text></g>`;
}
function fitBadges(){document.querySelectorAll('.bT').forEach(t=>{const w=t.getComputedTextLength();const r=t.parentNode.querySelector('.bR');const pad=parseFloat(t.getAttribute('font-size'))*.7;r.setAttribute('x',-w/2-pad);r.setAttribute('width',w+pad*2)})}
function sparkle(id,c='#fff6b0'){return `<path id="${id}" d="${star(26,8,4)}" fill="${c}"/>`}
function heart(id,c='#e63946',s=1){return `<path id="${id}" d="M0 ${30*s} C ${-60*s} ${-10*s} ${-40*s} ${-60*s} 0 ${-30*s} C ${40*s} ${-60*s} ${60*s} ${-10*s} 0 ${30*s}Z" fill="${c}"/>`}
function bulb(id){return `<g id="${id}" filter="url(#cut)"><circle r="150" fill="url(#glow)"/><g id="${id}-rays">${[0,1,2,3,4,5,6,7].map(i=>`<rect x="-7" y="-150" width="14" height="40" rx="7" fill="#ffd166" transform="rotate(${i*45})"/>`).join('')}</g>
  <circle cx="0" cy="-10" r="62" fill="#ffe066"/><path d="M-26 40 Q0 10 26 40" stroke="#f3a712" stroke-width="6" fill="none"/><rect x="-30" y="44" width="60" height="40" rx="8" fill="#9aa1a9"/><rect x="-30" y="58" width="60" height="7" fill="#6c757d"/></g>`}
function backpack(id){return `<g id="${id}" filter="url(#cut)"><rect x="-130" y="-300" width="260" height="300" rx="70" fill="#4361ee"/><rect x="-100" y="-130" width="200" height="110" rx="30" fill="#3a0ca3"/><rect x="-60" y="-300" width="120" height="40" rx="20" fill="#3a0ca3"/><rect x="-70" y="-90" width="140" height="10" rx="5" fill="#f9c74f"/><circle cx="0" cy="-200" r="28" fill="#f9c74f"/></g>`}
function confetti(id,n,seed,cols){const r=rnd(seed);let s=`<g id="${id}">`;for(let i=0;i<n;i++){const c=cols[i%cols.length];const x=r()*W,y=r()*H,rot=r()*360;s+= r()<.5?`<rect class="cf" data-x="${x}" data-y="${y}" data-r="${rot}" data-v="${60+r()*90}" x="-12" y="-7" width="24" height="14" fill="${c}"/>`:`<circle class="cf" data-x="${x}" data-y="${y}" data-r="${rot}" data-v="${60+r()*90}" r="10" fill="${c}"/>`}return s+'</g>'}
function runConfetti(id,t){document.querySelectorAll('#'+id+' .cf').forEach((e,i)=>{const x=+e.dataset.x,y0=+e.dataset.y,v=+e.dataset.v;const y=((y0+t*v)%(H+80))-40;e.setAttribute('transform',`translate(${(x+Math.sin(t*1.5+i)*20).toFixed(0)} ${y.toFixed(0)}) rotate(${(+e.dataset.r+t*90).toFixed(0)})`)})}
function hills(cols,seed,base=820){return cols.map((c,i)=>`<path d="${torn(-80,2000,base+i*70,40,seed+i*7,46)}" fill="${c}" filter="url(#big)"/>`).join('')}
function cloud(id,c='#fffaf0',sc=1){return `<g id="${id}" filter="url(#cut)"><g transform="scale(${sc})"><circle cx="-70" cy="10" r="55" fill="${c}"/><circle cx="0" cy="-20" r="75" fill="${c}"/><circle cx="75" cy="10" r="55" fill="${c}"/><rect x="-125" y="10" width="250" height="55" rx="27" fill="${c}"/></g></g>`}

// ---------- scenes ----------
const SC={};
SC.s0={bg:'#f2b134',build:()=>`
  <g id="s0-burst" transform="translate(960 600)">${sunburst(28,'#f2b134','#f6c453')}</g>
  ${hills(['#ef6f5e','#2a9d8f','#f6ecd9'],3,800)}
  ${confetti('s0-cf',26,11,['#ef6f5e','#2a9d8f','#fffaf0','#9b7fd1'])}
  <g id="s0-pen">${pencil('s0-penI',true,true)}</g>
  <g id="s0-title" filter="url(#cut)">${txt('قوّة الرسم الخارقة',190,'#264653')}</g>
  <g id="s0-sub">${badge('s0-subB','لماذا نرسم؟ وكيف يفيدنا كل يوم؟','#ef6f5e','#fffaf0',58)}</g>
  ${sparkle('s0-sp1')}${sparkle('s0-sp2','#fffaf0')}${sparkle('s0-sp3')}`,
 run(t,D){P('s0-burst',{x:960,y:640,r:t*8,j:0});runConfetti('s0-cf',t);
  P('s0-pen',{x:lerp(2200,1580,eo(k(t,.1,1.0))),y:520+Math.sin(t*3)*16,r:lerp(-60,18,eo(k(t,.1,1.0))),s:.95});
  const ps=pop(t,.7,.6);P('s0-title',{x:900,y:470,s:ps,r:-3*ps+3});
  P('s0-sub',{x:900,y:640,s:pop(t,1.4,.5),r:2});
  [['s0-sp1',380,300,1.2],['s0-sp2',1400,250,1.5],['s0-sp3',560,700,1.8]].forEach(([id,x,y,t0])=>P(id,{x,y,s:pop(t,t0,.4)*(1+.2*Math.sin(t*6)),r:t*60}));
 }};

SC.s1={bg:'#8ecae6',build:()=>`
  ${cloud('s1-c1','#fffaf0',1)}${cloud('s1-c2','#fffaf0',.7)}
  ${hills(['#8cc152','#6fa83a','#4f8a2b'],21,760)}
  <g id="s1-glowG"><circle r="260" fill="url(#glow)"/><g id="s1-rays">${[...Array(12)].map((_,i)=>`<rect x="-10" y="-250" width="20" height="90" rx="10" fill="#fff6b0" transform="rotate(${i*30})"/>`).join('')}</g></g>
  <g id="s1-pen">${pencil('s1-penI',true,true)}</g>
  ${backpack('s1-bag')}
  ${kid('k1','#e76f51')}
  ${sparkle('s1-sp1')}${sparkle('s1-sp2','#fffaf0')}${sparkle('s1-sp3')}${sparkle('s1-sp4','#fffaf0')}
  <g id="s1-q" filter="url(#cut)">${txt('!؟',150,'#e63946')}</g>`,
 run(t,D,v,vd){P('s1-c1',{x:lerp(1500,1300,t/D),y:180,j:.5});P('s1-c2',{x:lerp(400,560,t/D),y:250,j:.5});
  const tp=v+vd*.42; const up=eo(k(t,tp,tp+.8));
  P('s1-bag',{x:720,y:860,s:pop(t,.2,.5),r:Math.sin(t*20)*3*k(t,tp-1,tp)*(1-k(t,tp,tp+.2))});
  P('s1-pen',{x:720,y:lerp(800,380,up)+Math.sin(t*3)*12*up,s:.85*Math.max(up,.001),r:lerp(0,10,up)});
  P('s1-glowG',{x:720,y:340,s:up*(1+.06*Math.sin(t*5)),r:0,j:0});$('s1-rays').setAttribute('transform',`rotate(${t*25})`);
  [['s1-sp1',560,220],['s1-sp2',900,260],['s1-sp3',600,470],['s1-sp4',880,500]].forEach(([id,x,y],i)=>P(id,{x,y,s:pop(t,tp+.4+i*.15,.4)*(.8+.3*Math.sin(t*7+i)),r:t*80}));
  const tj=v+vd*.74; const jump=Math.max(0,Math.sin(clamp((t-tj)/0.5)*Math.PI))+Math.max(0,Math.sin(clamp((t-tj-0.55)/0.5)*Math.PI));
  P('k1',{x:lerp(2150,1340,eo(k(t,.1,1.2))),y:880-jump*70,s:1.0});
  mouth('k1', t<tp-.2?'S':(t<tj?'O':'B'));blink('k1',t);
  arm('k1','L', t<tj? lerp(8,30,k(t,tp,tp+.3)) : 150+Math.sin(t*10)*10);
  arm('k1','R', t<tj? lerp(-8,-30,k(t,tp,tp+.3)) : -150-Math.sin(t*10)*10);
  P('s1-q',{x:1340,y:400,s:pop(t,tp+.1,.4)*(1-k(t,tj-.3,tj)),r:-8});
 }};

SC.s2={bg:'#bde0e6',build:()=>`
  <g id="s2-sun" filter="url(#cut)"><g id="s2-sunR">${[...Array(12)].map((_,i)=>`<path d="M-18 -150 L0 -215 L18 -150Z" fill="#f6a01a" transform="rotate(${i*30})"/>`).join('')}</g><circle r="125" fill="#ffd166"/><ellipse cx="-38" cy="-12" rx="10" ry="14" fill="#7a4a12"/><ellipse cx="38" cy="-12" rx="10" ry="14" fill="#7a4a12"/><path d="M-40 30 Q0 70 40 30" stroke="#7a4a12" stroke-width="9" fill="none" stroke-linecap="round"/></g>
  ${hills(['#a7c957','#6a994e','#527a39'],31,790)}
  <g id="s2-ease" filter="url(#cut)"><path d="M-110 360 L-20 -40 M110 360 L20 -40 M0 -40 L0 330" stroke="#8d5a2b" stroke-width="20" stroke-linecap="round"/><rect x="-190" y="-170" width="380" height="290" rx="6" fill="#fffdf6"/><rect x="-200" y="112" width="400" height="22" rx="6" fill="#8d5a2b"/>
    <g id="s2-art"><path id="s2-a1" pathLength="1" d="M-120 70 Q-60 -10 0 40 Q60 -40 130 60" stroke="#2a9d8f" stroke-width="12" fill="none" stroke-linecap="round"/><circle id="s2-a2" pathLength="1" cx="80" cy="-60" r="42" stroke="#f3a712" stroke-width="12" fill="none"/><path id="s2-a3" pathLength="1" d="M-130 -90 q30 -30 60 0 q30 -30 60 0" stroke="#e76f51" stroke-width="10" fill="none" stroke-linecap="round"/></g></g>
  ${kid('k2','#9b7fd1')}
  <g id="s2-storm" filter="url(#cut)"><circle cx="-70" cy="10" r="55" fill="#6c757d"/><circle cx="0" cy="-20" r="75" fill="#6c757d"/><circle cx="75" cy="10" r="55" fill="#6c757d"/><rect x="-125" y="10" width="250" height="55" rx="27" fill="#6c757d"/><path id="s2-bolt" d="M10 60 L-30 140 L5 140 L-20 220 L50 120 L15 120 L40 60Z" fill="#ffd166"/>
   ${[-80,-40,40,80].map((x,i)=>`<rect class="drop" x="${x}" y="80" width="10" height="34" rx="5" fill="#4ea8de"/>`).join('')}</g>
  ${[0,1,2,3,4].map(i=>`<g id="s2-f${i}" filter="url(#cutS)"><rect x="-6" y="-90" width="12" height="90" fill="#2d6a4f"/>${[0,72,144,216,288].map(a=>`<ellipse cx="0" cy="-122" rx="18" ry="30" fill="${['#ef476f','#ffd166','#f78c6b','#c77dff','#ff99c8'][i]}" transform="rotate(${a} 0 -100)"/>`).join('')}<circle cx="0" cy="-100" r="16" fill="#fff3b0"/></g>`).join('')}
  <g id="s2-h">${badge('s2-hb','القوة ١ : الهدوء والتركيز','#264653')}</g>
  <g id="s2-xp">${badge('s2-xpb','+١٠٠ تركيز ⭐','#e63946','#fffaf0',56)}</g>`,
 run(t,D,v,vd){
  P('s2-h',{x:960,y:110,s:pop(t,.15,.5),r:-1.5});
  const tc=v+vd*.32; const calm=eo(k(t,tc,tc+2.2));
  P('s2-storm',{x:1320,y:lerp(240,-260,calm),s:lerp(1,.5,calm),o:1-k(t,tc+1.2,tc+2.2)});

  for(let i=0;i<4;i++){const a=hop0+i*.75; if(t>=a){const f=clamp((t-a)/.55);kx=lerp(pos[i][0],pos[i+1][0],eo(f));ky=lerp(pos[i][1],pos[i+1][1],f)-Math.sin(f*Math.PI)*120;}}
  P('k7',{x:kx,y:ky,s:.62});blink('k7',t);
  const atTop=t>hop0+3.0; mouth('k7',t<ty?'W':(atTop?'B':'S'));
  arm('k7','L',atTop?150+Math.sin(t*9)*10:20);arm('k7','R',atTop?-150-Math.sin(t*9)*10:-20);
  P('s7-star',{x:540,y:220,s:pop(t,hop0+3.0,.5)*(1+.06*Math.sin(t*6)),r:t*25});
  P('s7-t',{x:1360,y:250,s:pop(t,ty+.2,.5),r:-2});
 }};

SC.s8={bg:'#ef6f5e',build:()=>`

 run(t,D,v,vd){P('s8-burst',{x:960,y:480,r:t*10,j:0});runConfetti('s8-cf',t);

  if(ud>=1) P('s8-pen',{x:1580,y:lerp(440,560,eo(k(t,2.2,2.9)))+Math.sin(t*3)*14,s:.75,r:12});
  const tq=v+vd*.55;
  P('s8-q',{x:960,y:700,s:pop(t,tq,.55),r:Math.sin(t*3)*2.5});
  P('k8',{x:330,y:920,s:.85});blink('k8',t);mouth('k8','B');
  const ch=t>tq; arm('k8','L',ch?150+Math.sin(t*9)*12:20);arm('k8','R',ch?-150-Math.sin(t*9)*12:-20);
  const fade=k(t,D-.8,D); $('stage').style.filter=`brightness(${1-fade})`; $('tex').style.opacity=1-fade;
 }};

// ---------- build ----------
const TL=window.TL;
const root=$('scenes');
for(const s of TL.scenes){const g=document.createElementNS('http://www.w3.org/2000/svg','g');g.id='sc-'+s.id;g.style.display='none';
  g.innerHTML=`<rect width="1920" height="1080" fill="${SC[s.id].bg}"/>`+SC[s.id].build();root.appendChild(g);}
// wipe sheets
$('wipe').innerHTML=`<g id="wA" filter="url(#big)"><path d="${(()=>{const r=rnd(5);let d='M -2000 -200';for(let y=-200;y<=1300;y+=40)d+=` L ${(-2000+(r()-.5)*70).toFixed(0)} ${y}`;for(let y=1300;y>=-200;y-=40)d+=` L ${(2000+(r()-.5)*70).toFixed(0)} ${y}`;return d+'Z'})()}" fill="#f6ecd9"/></g>
<g id="wB" filter="url(#big)"><path d="${(()=>{const r=rnd(8);let d='M -1700 -200';for(let y=-200;y<=1300;y+=40)d+=` L ${(-1700+(r()-.5)*90).toFixed(0)} ${y}`;for(let y=1300;y>=-200;y-=40)d+=` L ${(1700+(r()-.5)*90).toFixed(0)} ${y}`;return d+'Z'})()}" fill="#f2b134"/>
${[...Array(6)].map((_,i)=>`<path d="${star(60,26)}" fill="#fffaf0" transform="translate(${-900+i*360} ${200+(i%2)*600}) rotate(${i*20})"/>`).join('')}</g>`;
$('wB').querySelector('path').setAttribute('fill','#2a9d8f');
let ready=false;
document.fonts.ready.then(()=>{document.querySelectorAll('#scenes > g').forEach(g=>g.style.display='');fitBadges();document.querySelectorAll('#scenes > g').forEach(g=>g.style.display='none');ready=true});
let lastScene=null;
const CAP={}; (window.CAPS||[]).forEach(c=>CAP[c.id]=c.cap);
function seek(T){
  FRAME=Math.floor(T*12); const t=FRAME/12;
  let cur=TL.scenes[0]; for(const s of TL.scenes) if(t>=s.start) cur=s;
  if(lastScene!==cur.id){for(const s of TL.scenes) $('sc-'+s.id).style.display=(s.id===cur.id)?'':'none';lastScene=cur.id;
    $('stage').style.filter='';$('tex').style.opacity=1;$('capG').style.display='';$('capT').textContent=CAP[cur.id]||''; const w=$('capT').getComputedTextLength(); $('capR').setAttribute('x',-w/2-40); $('capR').setAttribute('width',w+80);}
  const lt=t-cur.start; SC[cur.id].run(lt,cur.dur,(cur.vstart??0)-cur.start,cur.vdur??0);
  // caption
  if(cur.vstart!=null){const a=cur.vstart-cur.start; const o=k(lt,a-.1,a+.25)*(1-k(lt,a+cur.vdur+.4,a+cur.vdur+.8)); P('capG',{x:960,y:1005,s:.96+.04*o,o:o,r:-.6,j:.4});} else P('capG',{o:0});
  // wipe at boundaries
  let wx=null; for(const s of TL.scenes){ if(s.start===0) continue; const d=t-s.start; if(d>-.6&&d<.6){wx=d;} }
  if(wx!==null){const u=(wx+.6)/1.2; P('wA',{x:lerp(960+3100,960-3100,u),y:540,r:-4,j:0}); P('wB',{x:lerp(960+3500,960-2700,eio(u)),y:540,r:3,j:0});}
  else{P('wA',{o:0});P('wB',{o:0});}
}
window.seek=seek; window.isReady=()=>ready;
